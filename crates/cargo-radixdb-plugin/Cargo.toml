[package]
name = "cargo-radixdb-plugin"
version.workspace = true
edition = "2021"
rust-version.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true
description = "Official build, inspection, and packaging tool for RadixDB plugins"
license = "Apache-2.0"

[[bin]]
name = "cargo-radixdb-plugin"
path = "src/main.rs"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
libloading = "0.8"
radixdb-plugin-abi = { version = "=1.1.0", path = "../radixdb-plugin-abi" }
radixdb-plugin-host = { version = "=1.1.0", path = "../radixdb-plugin-host" }
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"

[dev-dependencies]
tempfile = "3.9"
