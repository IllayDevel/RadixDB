[package]
name = "radixdb-client"
version.workspace = true
edition = "2021"
rust-version.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
publish.workspace = true
description = "RadixDB binary protocol client"
license = "Apache-2.0"

[dependencies]
serde_json = "1.0"
thiserror = "2.0"
radixdb-orm = { version = "=1.1.0", path = "../radixdb-orm" }
radixdb-protocol = { version = "=1.1.0", path = "../radixdb-protocol" }
base64 = "0.22"
chrono = "0.4"
uuid = "1"
tokio = { version = "1", features = ["io-util", "net", "time"], optional = true }
rustls = "0.23"
rustls-pemfile = "2.2"
tokio-rustls = { version = "0.26", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }

[features]
default = []
tokio = ["dep:tokio", "dep:tokio-rustls"]
