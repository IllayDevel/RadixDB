[package]
name = "radixdb-functions"
version.workspace = true
edition = "2021"
rust-version.workspace = true
description = "SQL function contracts and built-in implementations for RadixDB"
license-file = "../../LICENSE"
publish = false

[features]
default = []
semantic = [
    "dep:candle-core",
    "dep:candle-nn",
    "dep:candle-transformers",
    "dep:tokenizers",
    "dep:hf-hub",
    "dep:parking_lot",
]

[dependencies]
radixdb-core = { path = "../radixdb-core" }
ahash = "0.8"
chrono = { version = "0.4", features = ["serde"] }
crc32fast = "1.4"
md-5 = "0.10"
rand = "0.9"
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
candle-core = { version = "0.9", optional = true }
candle-nn = { version = "0.9", optional = true }
candle-transformers = { version = "0.9", optional = true }
tokenizers = { version = "0.22", default-features = false, features = ["progressbar", "fancy-regex"], optional = true }
hf-hub = { version = "0.4", optional = true }
parking_lot = { version = "0.12", optional = true }
