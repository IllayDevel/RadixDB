[package]
name = "radixdb-core"
version.workspace = true
edition = "2021"
rust-version.workspace = true
description = "Canonical value, identity, and shared contracts for RadixDB"
license-file = "../../LICENSE"
publish = false

[features]
default = []
dhat-heap = []
test-failpoints = []

[dependencies]
ahash = "0.8"
chrono = { version = "0.4", features = ["serde"] }
crc32fast = "1.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
smallvec = "1.11"
thiserror = "2.0"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v7", "fast-rng"] }

[dev-dependencies]
rustc-hash = "1.1"
