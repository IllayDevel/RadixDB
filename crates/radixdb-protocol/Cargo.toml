[package]
name = "radixdb-protocol"
version.workspace = true
edition = "2021"
rust-version.workspace = true
description = "Versioned binary wire contract shared by RadixDB clients and servers"
license = "Apache-2.0"
publish = false

[dependencies]
bincode = { version = "2", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
