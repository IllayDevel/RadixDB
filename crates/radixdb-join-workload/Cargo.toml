[package]
name = "radixdb-join-workload"
version.workspace = true
edition = "2021"
rust-version.workspace = true
publish = false
license-file = "../../LICENSE"

[dependencies]
chrono = "0.4"
clap = { version = "4.4", features = ["derive"] }
libc = "0.2"
postgres = { version = "0.19", features = ["with-chrono-0_4", "with-uuid-1"], optional = true }
radixdb = { package = "radixdb-database", version = "=1.1.0", path = "../.." }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
uuid = { version = "1", optional = true }

[features]
postgres-oracle = ["dep:postgres", "dep:uuid"]

[dev-dependencies]
tempfile = "3.10"

[[bin]]
name = "radixdb-join-baseline"
path = "src/bin/radixdb_join_baseline.rs"

[[bin]]
name = "postgres-join-baseline"
path = "src/bin/postgres_join_baseline.rs"
required-features = ["postgres-oracle"]
