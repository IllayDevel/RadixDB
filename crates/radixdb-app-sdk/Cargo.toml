[package]
name = "radixdb-app-sdk"
version.workspace = true
edition = "2021"
rust-version.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
publish.workspace = true
description = "Domain-neutral application contracts and typed client facade for RadixDB"
license = "Apache-2.0"

[dependencies]
radixdb-client = { version = "=1.2.4", path = "../radixdb-client", features = ["tokio"] }
radixdb-orm = { version = "=1.2.4", path = "../radixdb-orm" }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
tokio = { version = "1", features = ["macros", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
