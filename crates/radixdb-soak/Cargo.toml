[package]
name = "radixdb-soak"
version.workspace = true
edition = "2021"
rust-version.workspace = true
description = "External RadixDB prerelease soak coordinator and status server"
license-file = "../../LICENSE"
publish = false
default-run = "radixdb-soak"

[dependencies]
base64 = "0.22"
clap = { version = "4.4", features = ["derive"] }
libc = "0.2"
postgres = "0.19"
radixdb-client = { path = "../radixdb-client" }
rand = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
signal-hook = "0.3"
thiserror = "2.0"
toml = "0.8"

[build-dependencies]
sha2 = "0.10"

[dev-dependencies]
radixdb = { path = "../.." }
tempfile = "3.10"
