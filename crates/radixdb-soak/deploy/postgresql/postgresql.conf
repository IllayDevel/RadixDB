# Constrained 2-core / 2-GiB / rotating-HDD comparison profile.
# It is deliberately durable and standalone. These are benchmark settings,
# not RadixDB production defaults and not general PostgreSQL recommendations.
listen_addresses = '127.0.0.1'
port = 25432
unix_socket_directories = '/run/radixdb-soak-postgresql'
max_connections = 320
superuser_reserved_connections = 3

# Bound per-cluster and per-session memory under the 256-client phase.
shared_buffers = '128MB'
huge_pages = off
temp_buffers = '1MB'
work_mem = '512kB'
hash_mem_multiplier = 1.0
maintenance_work_mem = '32MB'
autovacuum_work_mem = '32MB'
effective_cache_size = '768MB'

# Durability is part of the A/B contract and may not be weakened.
fsync = on
full_page_writes = on
synchronous_commit = on
wal_level = replica
wal_compression = on
wal_buffers = '16MB'
min_wal_size = '128MB'
max_wal_size = '1GB'
checkpoint_timeout = '5min'
checkpoint_completion_target = 0.9

# Preserve maintenance instead of turning it off for a flattering run.
autovacuum = on
autovacuum_max_workers = 1
autovacuum_naptime = '30s'
autovacuum_vacuum_cost_delay = '10ms'
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02

# The stand has one slow rotating device and two old CPU cores.
effective_io_concurrency = 1
maintenance_io_concurrency = 1
random_page_cost = 4.0
seq_page_cost = 1.0
max_worker_processes = 2
max_parallel_workers = 2
max_parallel_workers_per_gather = 1
jit = off

# Evidence is collected by the independent observer and the journal.
track_io_timing = on
track_wal_io_timing = on
track_activities = on
track_counts = on
logging_collector = off
log_destination = 'stderr'
log_checkpoints = on
log_autovacuum_min_duration = 0
log_lock_waits = on
deadlock_timeout = '1s'

