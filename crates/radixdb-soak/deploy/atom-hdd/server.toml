# Diagnostic-only profile for the dedicated 2 GiB Atom/HDD stand.
# These values must not be promoted to production defaults without the
# unchanged NVMe benchmark required by AGENTS.md.
[server]
bind_ip = "127.0.0.1"
port = 25441
data_dir = "/storage/radixdb-soak/data/current"
max_connections = 320
max_inflight_frame_bytes = 268435456
max_databases = 8
max_database_name_bytes = 64
connect_timeout_secs = 10
connection_idle_timeout_secs = 28800
net_read_timeout_secs = 1200
net_write_timeout_secs = 1200
cursor_batch_max_rows = 1024
cursor_batch_max_bytes = 8388608
max_frame_bytes = 67108864
copy_max_transaction_bytes = 134217728
max_compaction_jobs = 1
storage_cpu_workers = 0
page_cache_level = 0
page_cache_max_bytes = 0
page_cache_memory_reserve = 0
target_volume_rows = 1048576
seal_hot_bytes_threshold = 67108864
seal_incremental_hot_bytes_threshold = 16777216
read_queue_depth = 1
