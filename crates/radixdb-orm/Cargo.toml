[package]
name = "radixdb-orm"
version.workspace = true
edition = "2021"
rust-version.workspace = true
description = "Language-neutral RadixDB ORM IR, descriptors, and SQL renderer"
license = "Apache-2.0"

[dependencies]
radixdb-core = { path = "../radixdb-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"

[dev-dependencies]
jsonschema = { version = "0.33", default-features = false }
